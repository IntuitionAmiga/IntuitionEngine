<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob:; script-src-elem 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob:; worker-src 'self' blob:; child-src 'self' blob:;">
  <title>Intuition Engine - IE64 BASIC in your browser</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background:
        linear-gradient(115deg, rgba(45, 43, 85, 0.97), rgba(30, 30, 63, 0.95)),
        repeating-linear-gradient(90deg, rgba(158, 255, 255, 0.06) 0 1px, transparent 1px 88px);
      color: #F8F7FF;
      font-family: ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.4rem;
      padding: 1.5rem;
      text-align: center;
    }
    h1 { font-size: clamp(1.4rem, 4vw, 2.2rem); margin: 0; }
    p { color: #C9C3F5; max-width: 42rem; margin: 0; line-height: 1.5; }
    .hint { font-size: 0.85rem; color: #9A8FD8; }
    #launch {
      appearance: none;
      border: 1px solid #FAD000;
      background: #FAD000;
      color: #1E1E3F;
      font: inherit;
      font-weight: 720;
      padding: 0.9rem 1.6rem;
      border-radius: 0.35rem;
      cursor: pointer;
    }
    #launch:disabled { opacity: 0.6; cursor: progress; }
    #stage { width: 100%; display: flex; justify-content: center; }
    /* Ebiten injects its own <canvas> as a child of <body>; style every
       canvas so it is visible and framed wherever it lands. */
    canvas {
      display: block;
      max-width: 100%;
      height: auto;
      image-rendering: pixelated;
      border: 1px solid rgba(165, 153, 233, 0.55);
      border-radius: 0.4rem;
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.45);
      background: #0b0b1c;
    }
    a { color: #9EFFFF; }
    .back { position: fixed; top: 1rem; left: 1rem; font-size: 0.85rem; }
  </style>
</head>
<body>
  <a class="back" href="/">&larr; intuitionengine.com</a>
  <h1>IE64 BASIC, in your browser</h1>
  <p id="intro">
    A real Intuition Engine, compiled to WebAssembly and interpreted (no JIT in the
    browser). It preloads while you read; click Launch to boot IE64 BASIC. The demos are
    on the disk: try <code>DIR "Demos"</code>.
  </p>
  <button id="launch" type="button" disabled>Loading...</button>
  <p class="hint" id="status"></p>
  <div id="stage"></div>

  <script src="wasm_exec.js"></script>
  <script>
    (function () {
      var launch = document.getElementById('launch');
      var status = document.getElementById('status');
      var go = null;
      var pendingInstance = null;
      var started = false;

      function setStatus(msg) { status.textContent = msg; }

      // Preload: download and instantiate the wasm in the background on page
      // load, so clicking Launch boots instantly. No user gesture is needed for
      // this; only WebAudio needs one, satisfied by the Launch click.
      async function preload() {
        setStatus('Downloading ie.wasm (a full emulator, so it is large)...');
        try {
          if (typeof Go === 'undefined') {
            throw new Error('wasm_exec.js did not load');
          }
          go = new Go();
          // Diagnostic mode: /demo/?trace=1 traces host file I/O (FileIO,
          // HostFS, media loader) to the browser console. /demo/?yield=N
          // overrides the CPU cooperative-yield interval (ms) for A/B speed
          // measurement.
          var params = new URLSearchParams(location.search);
          if (params.has('trace')) {
            go.env.IE_TRACE_HOSTIO = '1';
          }
          if (params.has('yield')) {
            go.env.IE_WASM_YIELD_MS = params.get('yield');
          }
          // No cache-busting query: the browser revalidates via ETag (a 304
          // reuses the cached download AND the engine's compiled-code cache),
          // and a redeploy changes the ETag so a fresh copy is fetched.
          var resp = fetch('ie.wasm');
          var result;
          if (WebAssembly.instantiateStreaming) {
            result = await WebAssembly.instantiateStreaming(resp, go.importObject);
          } else {
            var bytes = await (await resp).arrayBuffer();
            result = await WebAssembly.instantiate(bytes, go.importObject);
          }
          pendingInstance = result.instance;
          launch.disabled = false;
          launch.textContent = 'Launch IE64 BASIC';
          setStatus('Ready. Click Launch.');
        } catch (err) {
          setStatus('Failed to load: ' + (err && err.message ? err.message : err));
        }
      }

      // Launch: run the preloaded instance. Instant, and the click is the
      // WebAudio user gesture.
      function launchBASIC() {
        if (started || !pendingInstance) { return; }
        started = true;
        launch.hidden = true;
        document.getElementById('intro').hidden = true;
        setStatus('Booting IE64 BASIC... waiting for the screen.');
        go.run(pendingInstance);
        adoptCanvas();
      }

      // Ebiten creates its <canvas> under <body> during RunGame, which runs
      // shortly after go.run on the pumped main goroutine. Poll for it, move it
      // into the stage, focus it and report its size so a blank result is
      // distinguishable from a missing canvas.
      function adoptCanvas() {
        var stage = document.getElementById('stage');
        var tries = 0;
        var timer = setInterval(function () {
          tries++;
          var c = document.querySelector('canvas');
          if (c) {
            clearInterval(timer);
            if (c.parentNode !== stage) { stage.appendChild(c); }
            c.setAttribute('tabindex', '0');
            c.scrollIntoView({ block: 'center' });
            c.focus();
            setStatus('Screen ready (' + c.width + '×' + c.height + '). Click it and type.');
          } else if (tries > 100) { // ~10s
            clearInterval(timer);
            setStatus('No canvas appeared after 10s - main() may be blocked before RunGame. Check the console.');
          }
        }, 100);
      }

      launch.addEventListener('click', launchBASIC);
      preload();
    })();
  </script>
</body>
</html>
